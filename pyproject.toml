[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptboundary"
version = "0.4.0"
description = "Host-controlled tool capabilities, quarantined text transformations, and conversational corrections."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
promptboundary = "promptboundary.cli:main"

[tool.setuptools]
packages = ["promptboundary"]

[tool.setuptools.data-files]
"share/promptboundary/skills/promptboundary" = ["skills/promptboundary/SKILL.md"]

"share/promptboundary/skills/promptboundary-tools" = ["skills/promptboundary-tools/SKILL.md"]
"share/promptboundary/skills/promptboundary-tools/scripts" = ["skills/promptboundary-tools/scripts/guard.py"]
"share/promptboundary/skills/promptboundary-tools/references" = ["skills/promptboundary-tools/references/checker.md", "skills/promptboundary-tools/references/integration.md"]
