[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptboundary"
version = "0.1.0"
description = "Apply conversational corrections to model replies and audit the resulting answer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
promptboundary = "promptboundary.cli:main"

[tool.setuptools]
packages = ["promptboundary"]

[tool.setuptools.data-files]
"share/promptboundary/skills/promptboundary" = ["skills/promptboundary/SKILL.md"]
