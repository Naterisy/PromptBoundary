name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: cmp SKILL.md skills/promptboundary/SKILL.md
      - run: python -m unittest discover -s tests -v
      - run: cd "$RUNNER_TEMP" && promptboundary demo
      - name: Verify published scores and cost aggregates offline
        run: >-
          python -m evaluation.verify
          evaluation/results/v1/model/primary
          evaluation/results/v2/model/confirmation
          evaluation/results/v2-regression/model/primary
          evaluation/results/v3-3b/model/validation3
          evaluation/results/v3-7b/model/validation3
      - name: Rebuild paired hosted scores and cost from the committed provider journals
        run: python -m evaluation.hosted.report --check
      - name: Verify fixed-draft controls and published journal privacy
        run: |
          python -m evaluation.hosted.stress.report --check
          python -m evaluation.hosted.public_logs evaluation/hosted --check
          python -m evaluation.hosted.check_runtime > "$RUNNER_TEMP/runtime-faults.json"
          cmp "$RUNNER_TEMP/runtime-faults.json" evaluation/hosted/runtime_faults.json
      - name: Verify agent effects, source bindings and incremental budget offline
        run: python -m evaluation.agent_security.verify_all
      - name: Exercise new SDK examples without an API key
        run: |
          python examples/capability_agent.py --attack
          python examples/source_bound_agent.py
